@import url('https://fonts.googleapis.com/css2?family=Slackey&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap');
/* ======================================================
   STUFF PAGE — Full CSS
   Design: Deep navy blue, gold accents, fixed/non-scrollable
====================================================== */

/* ── Reset & base ── */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.stuff-body {
  background: #0D1855;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: fixed;
  inset: 0;
  font-family: 'EB Garamond', serif;
}

/* ======================================================
   FULL-VIEWPORT FRAME
====================================================== */
.stuff-frame-bg {
  position: fixed;
  inset: 0;
  z-index: 19;
  pointer-events: none;
  border-style: solid;
  border-color: #0D1855;
  /* Frame is offset by 4vh/4vw, and its borders are 43px 25px 36px 25px */
  border-top-width: calc(4vh + 43px);
  border-bottom-width: calc(4vh + 36px);
  border-left-width: calc(4vw + 25px);
  border-right-width: calc(4vw + 25px);
}

.stuff-frame {
  position: fixed;
  top: 4vh;
  left: 4vw;
  width: 92vw;
  height: 92vh;
  pointer-events: none;
  z-index: 202;
  user-select: none;

  border-style: solid;
  border-width: 43px 25px 36px 25px;
  border-image-source: url('/images/stuff/stuffframe.PNG');
  border-image-slice: 15% 6% 13% 6%;
  border-image-repeat: stretch;
}

/* ======================================================
   LOGO — TOP CENTER, FIXED
====================================================== */
.stuff-header {
  width: 100%;
  display: flex;
  justify-content: center;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 35;
  background-color: #0D1855;
  padding: clamp(16px, 3vh, 40px) 0 clamp(16px, 3vh, 40px);
  transition: opacity 0.3s ease, filter 0.3s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

.stuff-header.is-hidden {
  transform: translateY(-100%);
}

.stuff-logo {
  width: clamp(198px, 31vw, 418px);
  height: auto;
  display: block;
  pointer-events: none;
  user-select: none;
}

/* ======================================================
   BOTTLES — BOTTOM CENTER, FIXED
====================================================== */
.stuff-bottles {
  position: fixed;
  bottom: 4vh;
  /* align baseline with stuff-frame */
  left: 50%;
  transform: translateX(-50%);
  width: clamp(300px, 70vw, 900px);
  height: auto;
  z-index: 25;
  pointer-events: none;
  user-select: none;
}

/* ======================================================
   ARROW BUTTONS
====================================================== */
.stuff-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  z-index: 30;
  padding: 8px;
  transition: opacity 0.2s, transform 0.2s;
}

.stuff-arrow img {
  width: clamp(24px, 3vw, 44px);
  height: auto;
  display: block;
}

.stuff-arrow--left {
  left: calc(27vw - min(18vw, 195px));
  transform: translate(-50%, -50%);
}

.stuff-arrow--right {
  right: calc(27vw - min(18vw, 195px));
  transform: translate(50%, -50%);
}

.stuff-arrow:hover {
  /* Retain exact horizontal transform on hover but scale up */
  transform: translateY(-50%) scale(1.15);
}

.stuff-arrow--left:hover {
  transform: translate(-50%, -50%) scale(1.15);
}

.stuff-arrow--right:hover {
  transform: translate(50%, -50%) scale(1.15);
}

/* ======================================================
   LAYOUT CONTENT (carousel area)
====================================================== */
.stuff-layout-content {
  position: fixed;
  inset: 0;
  z-index: auto;
  /* Removed z-index to allow modals to appear over the frame */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  /* vertical padding: clear logo (top) and bottles (bottom) */
  padding: clamp(100px, 25vh, 200px) clamp(60px, 8vw, 120px) clamp(120px, 22vh, 200px);
}



/* ======================================================
   CARD CAROUSEL — narrowed so 3 cards stay small
====================================================== */
.stuff-carousel-wrap {
  width: min(72%, 780px);
  overflow: hidden;
  margin: 0 auto;
}

.stuff-track {
  display: flex;
  gap: clamp(14px, 2vw, 28px);
  will-change: transform;
}

/* ======================================================
   STUFF CARD — matches screenshot
====================================================== */
.stuff-card {
  /* 3 visible per view */
  flex: 0 0 calc((100% - 2 * clamp(14px, 2vw, 28px)) / 3);
  /* Full card uses stuffborder.PNG as the decorative frame */
  border-style: solid;
  border-width: 19px;
  border-image-source: url('/images/stuff/stuffborder.PNG');
  border-image-slice: 8% 12% 9% 12%;
  border-image-repeat: stretch;
  /* stretch prevents bottom-center breaking vs round */
  background: none;
  aspect-ratio: 2 / 3;

  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(8px, 1.2vw, 14px) clamp(8px, 1.2vw, 14px) clamp(10px, 1.5vw, 16px);
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s ease;
}

@media (max-width: 768px) {
  .stuff-carousel-wrap {
    width: min(80%, 400px);
  }

  .stuff-card {
    /* show exactly 1 card on mobile */
    flex: 0 0 100%;
  }
}

/* Upper illustration block — stuffcardinside.PNG bg, fill most of card height */
.stuff-card__illustration {
  width: 100%;
  flex: 1;
  min-height: 0;
  background-image: url('/images/stuff/stuffcardinside.PNG');
  background-size: 100% 100%;
  /* stretch to fit entirely without cropping */
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 3px;
}

/* Thin white divider (matches screenshot line) */
.stuff-card__divider {
  display: block;
  width: 85%;
  height: 1.5px;
  background: #FACC53;
  margin: clamp(16px, 1vh, 10px) 0;
  flex-shrink: 0;
}

/* Bold white title — Slackey, same as blog */
.stuff-card__title {
  font-family: 'Slackey', cursive;
  font-size: clamp(13px, 1.4vw, 18px);
  color: #FACC53;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-align: center;
  flex-shrink: 0;
  line-height: 1.1;
}

/* ======================================================
   MODAL OVERLAY
====================================================== */
.stuff-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 202;
  /* above frame (20), arrows (30), layout (10) */
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8vh 8vw;
  background: transparent;
  opacity: 0;
  pointer-events: none;
}

.stuff-modal-overlay.is-active {
  opacity: 1;
  pointer-events: auto;
}

/* ======================================================
   MODAL PANEL
====================================================== */
.stuff-modal-panel {
  position: relative;
  width: 100%;
  height: 100%;
  background: #0D1855;
  color: #F5C842;

  /* Gold rough-outline border (color overridden per modal via inline style) */
  border: 3px solid;
  /* color from inline style */
  border-radius: 3px 9px 4px 8px / 7px 3px 9px 4px;
  outline: 2px solid;
  outline-offset: 6px;

  overflow-y: auto;
  padding: 0;
  /* top padding handled by sticky close bar */
}

/* ======================================================
   STICKY CLOSE BUTTON
====================================================== */
.stuff-modal-close {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: flex-end;
  padding: 14px 16px 8px;
  width: 100%;
  z-index: 10;
  box-sizing: border-box;
  border: none;
  cursor: pointer;
  opacity: 1;
}

.stuff-modal-close img {
  width: 32px;
  height: 32px;
  object-fit: contain;
  display: block;
}

.stuff-modal-close:hover img {
  opacity: 0.7;
}

/* ======================================================
   POPUP CONTENT
====================================================== */
.stuff-modal-body {
  padding: 0 clamp(24px, 5vw, 64px) clamp(40px, 6vh, 80px);
}

.stuff-popup-content {
  color: #F5C842;
}

.stuff-popup-title {
  font-family: 'Slackey', cursive;
  font-size: clamp(24px, 4vw, 48px);
  color: #F5C842;
  margin-bottom: 1.5rem;
  letter-spacing: 0.04em;
}

.stuff-popup-placeholder {
  font-family: 'EB Garamond', serif;
  font-size: clamp(16px, 1.8vw, 22px);
  color: rgba(245, 200, 66, 0.5);
  font-style: italic;

  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('moviesCanvas');
    if (!canvas) return;

    const cards = canvas.querySelectorAll('.draggable');
    let zIndexCounter = 100;
    let isDragging = false;
    let currentCard = null;
    let startX, startY, initialTx, initialTy;

    cards.forEach(card => {
      const downHandler = (e) => {
        if (e.type === 'mousedown' && e.button !== 0) return;
        
        isDragging = true;
        currentCard = card;
        
        zIndexCounter++;
        card.style.zIndex = zIndexCounter;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startX = clientX;
        startY = clientY;
        
        // Retrieve current translation values from dataset
        initialTx = parseFloat(card.dataset.tx) || 0;
        initialTy = parseFloat(card.dataset.ty) || 0;

        card.style.transform = `translate(${initialTx}px, ${initialTy}px) rotate(${card.dataset.rotation}deg) scale(1.05)`;

        e.preventDefault(); 
      };

      card.addEventListener('mousedown', downHandler);
      card.addEventListener('touchstart', downHandler, { passive: false });
    });

    const moveHandler = (e) => {
      if (!isDragging || !currentCard) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = clientX - startX;
      const dy = clientY - startY;

      const newTx = initialTx + dx;
      const newTy = initialTy + dy;
      
      currentCard.style.transform = `translate(${newTx}px, ${newTy}px) rotate(${currentCard.dataset.rotation}deg) scale(1.05)`;
      currentCard.dataset.currentTx = newTx;
      currentCard.dataset.currentTy = newTy;
    };

    const upHandler = () => {
      if (currentCard) {
        const finalTx = currentCard.dataset.currentTx || currentCard.dataset.tx;
        const finalTy = currentCard.dataset.currentTy || currentCard.dataset.ty;
        
        currentCard.style.transform = `translate(${finalTx}px, ${finalTy}px) rotate(${currentCard.dataset.rotation}deg) scale(1)`;
        
        // Update dataset with new values so next drag starts from here
        currentCard.dataset.tx = finalTx;
        currentCard.dataset.ty = finalTy;
      }
      isDragging = false;
      currentCard = null;
    };

    document.addEventListener('mousemove', moveHandler);
    document.addEventListener('touchmove', moveHandler, { passive: false });
    document.addEventListener('mouseup', upHandler);
    document.addEventListener('touchend', upHandler);
  });

form="rotate(28 932 302)"></rect></g></svg></div><div class="controls"><div class="top-row"><div class="now-playing"><div class="t" id="trackTitle">—</div><div class="a" id="trackArtist">—</div></div><div class="time-display"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div></div><div class="buffering-line" id="bufferingLine"></div><div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div><div class="buttons-row"><div class="transport"><button class="btn circle" id="prevBtn" title="Previous"><svg viewBox="0 0 24 24"><path d="M17 6l-8 6 8 6V6zm-9 0h2v12H8V6z"></path></svg></button><button class="btn circle play-pause" id="playBtn" title="Play/Pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"></path></svg></button><button class="btn circle" id="nextBtn" title="Next"><svg viewBox="0 0 24 24"><path d="M7 6l8 6-8 6V6zm9 0h2v12h-2V6z"></path></svg></button></div><div class="volume"><input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" title="Volume"></div></div><div class="status-line" id="statusLine"></div><div class="upcoming" id="upcoming"><div class="upcoming-heading">Up Next</div><div id="upcomingList"></div></div></div></div><audio id="audio" preload="metadata"></audio></div></section><script>
  /* =========================================================================
   VINYL PLAYER WIDGET
   - Loads a playlist from the Jamendo API (free, Creative-Commons catalogue)
   - Swap JAMENDO_CLIENT_ID for your own (https://devportal.jamendo.com)
   ========================================================================= */

  const JAMENDO_CLIENT_ID = "8e1f4e47"; // your Jamendo client_id
  const PLAYLIST_MODE = "tags"; // "tags" | "ids" | "demo"
  const PLAYLIST_TAGS = "chillout";
  const PLAYLIST_TRACK_IDS = [];
  const PLAYLIST_LIMIT = 10;

  // A ready-to-play public playlist (all Creative-Commons tracks from Jamendo's
  // open catalogue) — used instantly on load, and as the fallback if the live
  // API call is blocked (offline, ad-blocker, CORS, sandboxed preview, etc.)
  const DEMO_PLAYLIST = [
    {
      name: "mañana será tarde",
      artist_name: "fankel",
      image:
        "https://usercontent.jamendo.com?type=album&id=368084&width=300&trackid=1848357",
      audio:
        "https://prod-1.storage.jamendo.com/?trackid=1848357&format=mp31&from=app-devsite",
    },
    {
      name: "Scene 5",
      artist_name: "WE ARE FM",
      image:
        "https://usercontent.jamendo.com?type=album&id=104336&width=300&trackid=887209",
      audio:
        "https://prod-1.storage.jamendo.com/?trackid=887209&format=mp31&from=app-devsite",
    },
    {
      name: "Press Record",
      artist_name: "WE ARE FM",
      image:
        "https://usercontent.jamendo.com?type=album&id=104336&width=300&trackid=887202",
      audio:
        "https://prod-1.storage.jamendo.com/?trackid=887202&format=mp31&from=app-devsite",
    },
    {
      name: "Balrog Boogie",
      artist_name: "Diablo Swing Orchestra",
      image:
        "https://usercontent.jamendo.com?type=album&id=49216&width=300&trackid=391002",
      audio:
        "https://prod-1.storage.jamendo.com/?trackid=391002&format=mp31&from=app-devsite",
    },
  ];

  // ---- DOM refs ----
  const art = document.getElementById("art");
  const labelCover = document.getElementById("labelCover");
  const labelTitleText = document.getElementById("labelTitleText");
  const diskRingTextPath = document.getElementById("diskRingTextPath");
  const playGlyphPath = document.getElementById("playGlyphPath");
  const playIcon = document.getElementById("playIcon");
  const playBtn = document.getElementById("playBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const trackTitleEl = document.getElementById("trackTitle");
  const trackArtistEl = document.getElementById("trackArtist");
  const progressBar = document.getElementById("progressBar");
  const progressFill = document.getElementById("progressFill");
  const curTimeEl = document.getElementById("curTime");
  const durTimeEl = document.getElementById("durTime");
  const statusLine = document.getElementById("statusLine");
  const bufferingLine = document.getElementById("bufferingLine");
  const audio = document.getElementById("audio");
  const volumeSlider = document.getElementById("volumeSlider");
  const upcomingList = document.getElementById("upcomingList");

  let playlist = [];
  let currentIndex = 0;
  let isPlaying = false;

  // --- Guards against the "buffering glitch": these three flags stop the
  // title/label from flickering or skipping tracks on transient stall events.
  let isTransitioningTrack = false; // true while we're deliberately loading a new track
  let loadToken = 0; // increments each loadTrack() call; stale async callbacks are ignored
  let errorRetryCount = 0; // retries once before actually skipping a track

  const ICON_PLAY = "M8 5v14l11-7z";
  const ICON_PAUSE = "M6 5h4v14H6zm8 0h4v14h-4z";
  const GLYPH_PLAY = "M-8,-14 L-8,14 L16,0 Z";
  const GLYPH_PAUSE =
    "M-14,-14 L-4,-14 L-4,14 L-14,14 Z M4,-14 L14,-14 L14,14 L4,14 Z";

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60)
      .toString()
      .padStart(2, "0");
    return `${m}:${s}`;
  }

  function setIcons(playing) {
    playIcon.setAttribute("d", playing ? ICON_PAUSE : ICON_PLAY);
    playGlyphPath.setAttribute("d", playing ? GLYPH_PAUSE : GLYPH_PLAY);
  }

  // Truncates long titles so the SVG label text never overflows the disc.
  function fitTitle(name) {
    if (!name) return "Untitled";
    return name.length > 22 ? name.slice(0, 21) + "…" : name;
  }

  function setCoverImage(url) {
    labelCover.classList.remove("loaded");
    if (!url) return;
    // Set both href and xlink:href — some browsers (older Safari, some
    // embedded webviews) only recognise the namespaced xlink:href on SVG
    // <image>, which is why cover art could silently fail to appear before.
    labelCover.setAttribute("href", url);
    labelCover.setAttributeNS("http://www.w3.org/1999/xlink", "href", url);
  }

  function setTitleText(track) {
    // Update all title/artist copies ATOMICALLY, in one go, so the UI never
    // shows a half-updated / stale-then-fresh flicker while buffering.
    labelTitleText.textContent = fitTitle(track.name);
    trackTitleEl.textContent = track.name || "Untitled";
    trackArtistEl.textContent = track.artist_name || "Unknown artist";
    setCoverImage(track.image);
    setDiskRingText(track.name);
  }

  // Repeats "NAME • " enough times to wrap fully around the guide circle
  // (circumference ≈ 2·π·180 ≈ 1131px), so the loop reads seamlessly.
  function setDiskRingText(name) {
    const label = (name || "Untitled").toUpperCase() + " \u2022 ";
    const approxCharWidth = 14; // rough average glyph width at this font-size/letter-spacing
    const circumference = 2 * Math.PI * 180;
    let repeated = "";
    while (repeated.length * approxCharWidth < circumference) {
      repeated += label;
    }
    diskRingTextPath.textContent = repeated;
  }

  labelCover.addEventListener("load", () => labelCover.classList.add("loaded"));
  labelCover.addEventListener("error", () =>
    labelCover.classList.remove("loaded"),
  );

  function renderUpcoming() {
    if (!playlist.length) {
      upcomingList.innerHTML = "";
      return;
    }
    const count = Math.min(3, playlist.length - 1); // never show the currently-playing track
    let html = "";
    for (let i = 1; i <= count; i++) {
      const t = playlist[(currentIndex + i) % playlist.length];
      html += `<div class="upcoming-row">
      <span class="num">${i}</span>
      <div class="info">
        <div class="name">${t.name || "Untitled"}</div>
        <div class="artist">${t.artist_name || "Unknown artist"}</div>
      </div>
    </div>`;
    }
    upcomingList.innerHTML = html;
  }

  function loadTrack(index, autoplay) {
    if (!playlist.length) return;

    currentIndex = (index + playlist.length) % playlist.length;
    const t = playlist[currentIndex];
    renderUpcoming();
    const myToken = ++loadToken; // this load "owns" this token
    isTransitioningTrack = true;
    errorRetryCount = 0;

    // Fade the text out briefly, THEN swap it in one atomic update — this is
    // what removes the "glitchy" mid-buffer flicker of the previous fix.
    trackTitleEl.classList.add("fading");
    bufferingLine.classList.add("show");

    setTimeout(() => {
      if (myToken !== loadToken) return; // a newer track load has since started — ignore this stale one
      setTitleText(t);
      trackTitleEl.classList.remove("fading");
      audio.src = t.audio;
      progressFill.style.width = "0%";
      curTimeEl.textContent = "0:00";
      durTimeEl.textContent = "0:00";
      if (autoplay) play();
    }, 140);
  }

  function play() {
    audio
      .play()
      .then(() => {
        isPlaying = true;
        art.classList.add("spinning");
        setIcons(true);
      })
      .catch((err) => {
        // Surface the real browser error instead of a generic message — this
        // tells us whether it's an autoplay block, a network/CORS failure, or
        // an unsupported source, which are three very different fixes.
        const reason =
          (audio.error && audio.error.message) ||
          err.message ||
          err.name ||
          "unknown error";
        statusLine.textContent = `Couldn't start playback (${reason}). Try clicking again.`;
        console.error("Playback failed:", err, audio.error);
      });
  }

  function pause() {
    audio.pause();
    isPlaying = false;
    art.classList.remove("spinning");
    setIcons(false);
  }

  function togglePlay() {
    if (!playlist.length) return;
    isPlaying ? pause() : play();
  }

  function next() {
    loadTrack(currentIndex + 1, isPlaying);
  }
  function prev() {
    loadTrack(currentIndex - 1, isPlaying);
  }

  // ---- Events ----
  art.addEventListener("click", togglePlay);
  playBtn.addEventListener("click", togglePlay);
  nextBtn.addEventListener("click", next);
  prevBtn.addEventListener("click", prev);

  audio.addEventListener("waiting", () => {
    bufferingLine.classList.add("show");
  });
  audio.addEventListener("playing", () => {
    bufferingLine.classList.remove("show");
    isTransitioningTrack = false;
  });
  audio.addEventListener("canplay", () => {
    bufferingLine.classList.remove("show");
  });

  audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
      progressFill.style.width =
        (audio.currentTime / audio.duration) * 100 + "%";
      curTimeEl.textContent = fmtTime(audio.currentTime);
    }
  });
  audio.addEventListener("loadedmetadata", () => {
    durTimeEl.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener("ended", next);

  // Only skip on a REAL fatal error (not transient stalls while buffering),
  // and retry once before giving up — this was the source of tracks/titles
  // rapidly cycling ("glitching") while a track was still buffering.
  audio.addEventListener("error", () => {
    if (isTransitioningTrack) return; // ignore errors from a load we already abandoned
    const codeNames = {
      1: "aborted",
      2: "network error",
      3: "decode error",
      4: "source not supported",
    };
    const code = audio.error ? audio.error.code : null;
    console.error(
      "Audio element error:",
      code,
      codeNames[code] || "",
      audio.currentSrc,
    );
    if (errorRetryCount < 1) {
      errorRetryCount++;
      audio.load();
      return;
    }
    statusLine.textContent = `This track failed to load (${codeNames[code] || "error"}) — skipping to the next one.`;
    next();
  });

  function setVolumeUI(v) {
    volumeSlider.style.setProperty("--vol", v * 100 + "%");
  }
  volumeSlider.addEventListener("input", () => {
    const v = parseFloat(volumeSlider.value);
    audio.volume = v;
    setVolumeUI(v);
  });
  setVolumeUI(parseFloat(volumeSlider.value));

  progressBar.addEventListener("click", (e) => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audio.currentTime = ratio * audio.duration;
  });

  // ---- Playlist loading (Jamendo API, with an instant offline-safe demo playlist) ----
  function startWithDemoPlaylist() {
    playlist = DEMO_PLAYLIST;
    loadTrack(0, false);
  }

  async function tryLiveJamendoFetch() {
    if (PLAYLIST_MODE === "demo") return; // demo mode: skip the network call entirely

    try {
      let url;
      if (PLAYLIST_MODE === "ids" && PLAYLIST_TRACK_IDS.length) {
        url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&id=${PLAYLIST_TRACK_IDS.join(",")}`;
      } else {
        url = `https://api.jamendo.com/v3.0/tracks/?client_id=${JAMENDO_CLIENT_ID}&format=json&limit=${PLAYLIST_LIMIT}&tags=${encodeURIComponent(PLAYLIST_TAGS)}&include=musicinfo&audioformat=mp32`;
      }

      const res = await fetch(url);
      if (!res.ok) return; // stay on the demo playlist, no visible error
      const data = await res.json();
      if (!data.results || !data.results.length) return;

      const liveTracks = data.results
        .filter((t) => t.audio)
        .map((t) => ({
          name: t.name,
          artist_name: t.artist_name,
          image: t.album_image || t.image,
          audio: t.audio,
        }));

      if (!liveTracks.length) return;

      // Swap in the live playlist quietly. If nothing has played yet, load
      // its first track; otherwise leave the current track playing and just
      // extend the queue.
      playlist = liveTracks;
      if (!isPlaying && audio.currentTime === 0) {
        loadTrack(0, false);
      }
      renderUpcoming();
      statusLine.textContent = "";
    } catch (err) {
      // Network blocked / CORS / offline — this is expected in some sandboxed
      // environments. Silently keep using the demo playlist, no user-facing error.
      console.info("Live Jamendo fetch unavailable, using demo playlist.", err);
    }
  }

  startWithDemoPlaylist();
  tryLiveJamendoFetch();
